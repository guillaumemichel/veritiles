<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>veritiles + routing hints (anchor-only page)</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <script src="https://unpkg.com/maplibre-gl@6.2.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@6.2.0/dist/maplibre-gl.css" rel="stylesheet">
    <script src="https://unpkg.com/pmtiles@4.4.1/dist/pmtiles.js"></script>
    <script src="https://unpkg.com/veritiles@0.4/dist/veritiles.js"></script>
    <style>
        body { margin: 0; }
        #map { position: absolute; inset: 0; }
        #badge {
            position: absolute; top: 10px; right: 10px; z-index: 1;
            background: rgba(255, 255, 255, 0.9); border-radius: 4px;
            padding: 6px 10px; font: 13px/1.4 monospace;
        }
        #badge .rejected { color: #c0392b; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="badge">loading…</div>
    <script>
        // The self-contained page: it ships ONLY the anchor. Location lives in
        // a sibling `hints.json` (untrusted — every byte is still verified
        // against the anchor), so moving hosts is an edit to one JSON file, no
        // page change and no re-anchor. Put beside this page, for example:
        //
        //   hints.json
        //   {
        //     "hints": {
        //       "bafyrei…desc": ["https://node.example/world.pmtiles.proofs"],
        //       "bafkrei…file": ["https://cdn-a.example/world.pmtiles",
        //                        "https://cdn-b.example/world.pmtiles"]
        //     }
        //   }
        //
        // The descriptor CID maps to the proof base directory; the map's raw
        // CID maps to the archive, with cdn-b as a failover. Both are printed
        // by `npm run pack -- world.pmtiles`.
        const source = new veritiles.VerifiedSource({ cid: 'bafyrei…' });
        // `hints` defaults to './hints.json'; pass it to point elsewhere,
        // or `source`/`proof` to configure hosts directly instead.

        const protocol = new pmtiles.Protocol();
        maplibregl.addProtocol('pmtiles', protocol.tile);
        protocol.add(new pmtiles.PMTiles(source)); // before the style loads

        const map = new maplibregl.Map({
            container: 'map',
            center: [0, 20],
            zoom: 2,
            style: {
                version: 8,
                sources: {
                    verified: {
                        type: 'vector',
                        url: 'pmtiles://' + source.getKey(),
                        attribution: '<a href="https://github.com/protomaps/basemaps">Protomaps</a> © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                    },
                },
                layers: [
                    { id: 'background', type: 'background', paint: { 'background-color': '#f0f8ff' } },
                    { id: 'land', type: 'fill', source: 'verified', 'source-layer': 'land',
                      paint: { 'fill-color': '#f8f4f0' } },
                    { id: 'water', type: 'fill', source: 'verified', 'source-layer': 'water',
                      paint: { 'fill-color': '#a0c8f0' } },
                ],
            },
        });

        const badge = document.getElementById('badge');
        setInterval(() => {
            const { verified, rejected } = source.stats;
            badge.innerHTML = `✓ ${verified} hashes verified` +
                (rejected ? ` / <span class="rejected">✗ ${rejected} tampered</span>` : '');
        }, 500);
    </script>
</body>
</html>
