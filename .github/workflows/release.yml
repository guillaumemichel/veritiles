# Publish to npm on a version tag (v1.2.3): every package whose version npm
# does not have yet. anymirror, @anymirror/fisl-router and veritiles share the
# version line, which the tag names; @anymirror/router moves only when the
# contract changes, so most releases leave it as it is. Publishing to npm is all a CDN needs: unpkg and
# jsDelivr mirror the registry automatically.
#
# Auth is npm TRUSTED PUBLISHING (OIDC): no tokens, and provenance
# attestations are generated automatically. Each package names this workflow
# as its trusted publisher on npmjs.com.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write # OIDC for trusted publishing + provenance
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - name: Tag must match the version line
        run: |
          version="v$(node -p "require('./packages/anymirror/package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match anymirror's version $version" >&2
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:packages
      # The contract first: the packages after it depend on it. A prerelease
      # goes out under `next`, never `latest`.
      - name: Publish the versions npm lacks
        run: |
          for dir in router anymirror fisl-router veritiles; do
            name=$(node -p "require('./packages/$dir/package.json').name")
            version=$(node -p "require('./packages/$dir/package.json').version")
            if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "$name@$version is on npm already"
              continue
            fi
            case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
            npm publish -w "packages/$dir" --tag "$tag"
          done
      - name: Create draft GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --draft
        env:
          GH_TOKEN: ${{ github.token }}
